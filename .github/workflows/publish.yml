name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine hatchling

      - name: Build package
        run: python -m build --no-isolation

      - name: Clean-room smoke test (install built wheel, import it)
        # Catches the v0.1.0 failure: a wheel whose package folder name does not
        # match the import name. Tests the ARTIFACT, not the source tree — so it
        # runs from /tmp where the llm_behave/ source folder is NOT importable.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import llm_behave; from llm_behave import assert_behavior; assert_behavior('the weather is sunny', tool_calls=[{'name': 'get_weather', 'arguments': {}}]).calls_tool('get_weather'); print('OK: llm_behave', llm_behave.__version__)"

      - name: Upload to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
