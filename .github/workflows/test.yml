name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # run manually from the Actions tab (or the API) on any branch

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy llm_behave

  core:
    name: Core install (no ML extras)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Proves the README's "core works without ML dependencies" claim: tests that
      # need sentence-transformers are skipped, everything else must pass.
      - name: Install core package only
        run: pip install -e . pytest-cov

      - name: Run tests (semantic tests skip)
        run: python -m pytest tests/ -q -rs

  test:
    name: Full suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Shared runners are slower than a dev machine; scale the timing assertions
      LLM_BEHAVE_PERF_FACTOR: "5"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models
        # all-MiniLM-L6-v2 (~80MB) + the NLI model are downloaded on first use.
        # Caching them keeps reruns to ~1-2 min instead of re-downloading each time.
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Install package with ML extras
        run: pip install -e ".[semantic,dev]"

      - name: Run full test suite
        run: python -m pytest tests/ -q --cov=llm_behave --cov-report=term-missing

      - name: Benchmark assertion latency (manual runs only)
        if: github.event_name == 'workflow_dispatch' && matrix.python-version == '3.12'
        run: python tools/benchmark.py

  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Install the wheel in a clean venv and confirm pytest finds the plugin
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import llm_behave; print(llm_behave.__version__)"
          /tmp/smoke/bin/python -m pytest --trace-config --co -q 2>&1 | grep -i llm_behave
