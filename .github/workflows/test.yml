name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models
        # all-MiniLM-L6-v2 (~80MB) + the NLI model are downloaded on first use.
        # Caching them keeps reruns to ~1-2 min instead of re-downloading each time.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Install package with ML extras
        run: pip install -e ".[semantic,dev]"

      - name: Run full test suite
        run: python -m pytest tests/ -q
